services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_MYSQL_DB:-chatdb}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-chatuser}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASS:-chatpass}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-rootpass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["realtime"]
    ports:
      - "6379:6379"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${DOCKER_MYSQL_USER:-chatuser}
      MYSQL_PASS: ${DOCKER_MYSQL_PASS:-chatpass}
      MYSQL_DB: ${DOCKER_MYSQL_DB:-chatdb}
      DB_SYNCHRONIZE: "false"
      UPLOAD_PATH: /app/storage/assets/chat/uploads
      ASSETS_PATH: /app/storage/assets
      REDIS_ENABLED: ${DOCKER_REDIS_ENABLED:-false}
      REDIS_HOST: redis
    ports:
      - "3001:3001"
    volumes:
      - ./storage/assets:/app/storage/assets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/frontend/index.html', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
